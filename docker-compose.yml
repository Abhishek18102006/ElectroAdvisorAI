version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: electroadvisor_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./catalog.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend/catalog.db:/app/catalog.db
